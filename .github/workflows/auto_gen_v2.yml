name: Auto Strategy Generator V2

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Give it enough time for the larger grid search
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install numpy pandas yfinance scipy
        
    - name: Run Auto-Generator Script
      env:
        PYTHONUNBUFFERED: 1
      run: |
        python auto_strategy_generator_v2.py
