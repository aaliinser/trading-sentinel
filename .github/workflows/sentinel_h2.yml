name: Sentinel H2 Trading Bot

on:
  schedule:
    # تشغيل كل 5 دقائق (توافق الفريم الزمني للتحليل)
    - cron: '*/5 * * * *'
  workflow_dispatch: # للسماح بالتشغيل اليدوي للاختبار

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run H2 Sentinel Script
        env:
          # ─── Telegram Configuration ───
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          
          # ─── Deriv API Configuration (NEW) ───
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          DERIV_APP_ID: "1089" # المعرف الافتراضي العام لـ Deriv
          
          # ─── Strategy Symbols (Optional Override) ───
          # إذا أردت تغيير الأزواج دون تعديل الكود، ضعها هنا مفصولة بفواصل
          # SYMBOLS_H2: "USDJPY=X,EURAUD=X,USDCHF=X,EURCAD=X,CADJPY=X"
          
        run: python sentinel_h2.py

      - name: Save State File to Repository
        if: always() # حتى لو فشل السكربت، نحاول حفظ الحالة لتجنب فقدان البيانات
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add state_h2.json || true
          git commit -m "Auto-update bot state $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main || true
