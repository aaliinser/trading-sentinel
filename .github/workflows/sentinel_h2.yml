name: Sentinel_H2

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: h2-live
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run H2 Sentinel
        run: python sentinel_h2.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}

      - name: Save state to repository
        run: |
          set -e
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add state_h2.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "✅ No state changes to commit"
            exit 0
          fi
          git commit -m "Update state [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin ${{ github.ref }} 2>/dev/null || git rebase --abort 2>/dev/null || true
            if git push origin HEAD:${{ github.ref }} 2>/dev/null; then
              echo "✅ State pushed successfully (attempt $attempt)"
              exit 0
            fi
            echo "⚠️ Push failed, retrying in 5 seconds (attempt $attempt/3)..."
            sleep 5
          done
          echo "❌ Failed to push state after 3 attempts (non-fatal)"
          exit 0
