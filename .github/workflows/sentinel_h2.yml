name: Sentinel H2 Trading Bot (Smart Freeze Edition)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run H2 Sentinel Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          DERIV_APP_ID: "1089" 
          SYMBOLS_H2: "USDJPY=X,EURAUD=X,USDCHF=X,EURCAD=X,CADJPY=X,GBPUSD=X,USDCAD=X,AUDNZD=X,EURGBP=X"
        run: python sentinel_h2.py

      - name: Save State File to Repository (ROBUST MODE V3)
        if: always()
        run: |
          echo "--- Starting Robust Save Process ---"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f state_h2.json ]; then
            git add state_h2.json || true
          else
            echo "Warning: state_h2.json not found! Skipping save."
            exit 0
          fi
          
          if ! git diff --cached --quiet; then
            echo "Changes detected. Preparing commit..."
            
            COMMIT_MSG="Auto-update bot state $(date +'%Y-%m-%d %H:%M:%S')"
            git commit -m "$COMMIT_MSG" || {
              echo "Commit failed or nothing to commit."
              exit 0
            }
            
            echo "Attempting to pull latest changes with rebase..."
            git pull origin main --rebase || {
              echo "Pull/Rebase failed. Trying merge strategy..."
              git pull origin main --no-edit || true
            }
            
            MAX_RETRIES=5
            RETRY_COUNT=0
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "Attempt $((RETRY_COUNT+1))/$MAX_RETRIES to push..."
              
              if git push origin main; then
                echo "✅ SUCCESS: State file pushed successfully!"
                break
              else
                echo "❌ PUSH FAILED. Retrying in 10 seconds..."
                sleep 10
                RETRY_COUNT=$((RETRY_COUNT+1))
                
                if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                  echo "⚠️ All retries exhausted. Attempting force push as last resort..."
                  git push origin main --force-with-lease || echo "Final Force Push also failed."
                fi
              fi
            done
          else
            echo "No changes to commit. Skipping push."
          fi
          
          echo "--- End of Robust Save Process ---"
