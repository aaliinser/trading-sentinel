name: Sentinel H2 Trading Bot (Fast Mode)

on:
  schedule:
    # تشغيل كل 5 دقائق (توافق الفريم الزمني للتحليل)
    - cron: '*/5 * * * *'
  workflow_dispatch: # للسماح بالتشغيل اليدوي للاختبار الفوري

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run H2 Sentinel Script (FAST VERSION)
        env:
          # ─── Telegram Configuration ───
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          
          # ─── Deriv API Configuration (Optional for future use) ───
          # حتى لو لم تستخدمه الآن، وجوده لا يضر إذا كان فارغا أو خاطئا
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          DERIV_APP_ID: "1089" 
          
          # ─── Strategy Symbols Override ───
          # نستخدم الرموز الافتراضية داخل الكود، لكن يمكننا تمريرها هنا لو أردنا تغييرها دون تعديل الكود
          SYMBOLS_H2: "USDJPY=X,EURAUD=X,USDCHF=X,EURCAD=X,CADJPY=X,GBPUSD=X,USDCAD=X,AUDNZD=X,EURGBP=X"
          
        # ⭐⭐⭐ التغيير الجوهري هنا ⭐⭐⭐
        # نشغل الملف الموجود فعلا في المستودع: sentinel_h2.py
        run: python sentinel_h2.py

      - name: Save State File to Repository (Robust Mode)
        if: always() # حتى لو فشل السكربت، نحاول حفظ الحالة لتجنب فقدان البيانات
        run: |
          git config user.name github-actions
          git user.email github-actions@github.com
          
          # إضافة التغييرات
          git add state_h2.json || true
          
          # محاولة الالتزام (Commit) فقط إذا كان هناك تغييرات فعلية
          if ! git diff --cached --quiet; then
            echo "Changes detected in state file. Committing..."
            git commit -m "Auto-update bot state $(date +'%Y-%m-%d %H:%M')"
            
            # سحب آخر التغييرات من الفرع الرئيسي أولا لتجنب التعارضات (Merge Conflicts)
            git pull origin main --rebase || true
            
            # الدفع للمستودع
            git push origin main || true
          else
            echo "No changes to commit."
          fi
