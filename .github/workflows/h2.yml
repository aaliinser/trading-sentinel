name: H2 Live Bot (v28 Strategy)

on:
  schedule:
    - cron: '*/5 * * * *' # تشغيل كل 5 دقائق
  workflow_dispatch: # للسماح بالتشغيل اليدوي للاختبار

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests python-dotenv

      - name: Run H2 Live Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python h2_live.py

      - name: Save State File
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # إضافة ملف الحالة فقط إذا تغير
          if [ -f state_h2.json ]; then
            git add state_h2.json || true
          fi
          
          if ! git diff --cached --quiet; then
            echo "Saving state..."
            git commit -m "Update bot state $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
            
            # محاولة الدفع مع إعادة المحاولة البسيطة
            for i in {1..3}; do
              if git push origin main; then
                echo "✅ State saved successfully!"
                break
              else
                echo "❌ Push failed. Retrying ($i/3)..."
                sleep 5
                git pull origin main --rebase || true
              fi
            done
          else
            echo "No changes to state."
          fi
