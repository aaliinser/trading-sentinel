name: H1 Stochastic Backtest v2.0 (Production Grade)

on:
  # التشغيل اليدوي فقط لتجنب استهلاك الموارد تلقائياً
  workflow_dispatch:
  
  # يمكنك تفعيل هذا الجزء إذا أردت تشغيله تلقائياً عند تعديل ملف الكود
  # push:
  #   paths:
  #     - 'h1_stoch_backtest_v2.py'

jobs:
  backtest-job-h1-v2:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance
      
      - name: Run H1 Stochastic Backtest Script (v2.0)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=================================================="
          echo "STARTING: H1 STOCHASTIC EXTREME REVERSAL BACKTEST"
          echo "VERSION: 2.0 (Fixed Math + Spread Cost Modeling)"
          echo "SCRIPT: h1_stoch_backtest_v2.py"
          echo "=================================================="
          
          # تنفيذ السكربت وحفظ المخرجات في ملف نصي للسهولة في القراءة لاحقاً
          python h1_stoch_backtest_v2.py > h1_backtest_results_v2.txt
          
          # عرض النتائج على شاشة الـ Log فوراً
          cat h1_backtest_results_v2.txt
          
          echo "=================================================="
          echo "BACKTEST COMPLETED SUCCESSFULLY."
          echo "Results saved to: h1_backtest_results_v2.txt"
          echo "=================================================="
          
      - name: Upload Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-stoch-backtest-v2-results
          path: h1_backtest_results_v2.txt
          retention-days: 7
