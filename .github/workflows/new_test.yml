name: Quant Backtest Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install numpy pandas yfinance scipy

    - name: Run Backtest Script
      env:
        PYTHONUNBUFFERED: 1
      run: |
        python backtest_new_strategy.py
