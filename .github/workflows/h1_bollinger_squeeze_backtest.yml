name: H1 Bollinger Squeeze Sniper Backtest (Council Strategy)

on:
  # التشغيل اليدوي فقط لتجنب استهلاك الموارد تلقائياً
  workflow_dispatch:
  
  # يمكنك تفعيل هذا الجزء إذا أردت تشغيله تلقائياً عند تعديل ملف الكود
  # push:
  #   paths:
  #     - 'h1_bollinger_squeeze_backtest.py'

jobs:
  backtest-job-squeeze-v1:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance
      
      - name: Run H1 Bollinger Squeeze Backtest Script (v1.0)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=================================================="
          echo "STARTING: H1 BOLLINGER SQUEEZE SNIPER BACKTEST"
          echo "VERSION: 1.0 (Council Approved Hybrid Strategy)"
          echo "SCRIPT: h1_bollinger_squeeze_backtest.py"
          echo "STRATEGY: Volatility Breakout + EMA Trend Filter"
          echo "=================================================="
          
          # تنفيذ السكربت وحفظ المخرجات في ملف نصي للسهولة في القراءة لاحقاً
          python h1_bollinger_squeeze_backtest.py > h1_squeeze_results_v1.txt
          
          # عرض النتائج على شاشة الـ Log فوراً
          cat h1_squeeze_results_v1.txt
          
          echo "=================================================="
          echo "BACKTEST COMPLETED SUCCESSFULLY."
          echo "Results saved to: h1_squeeze_results_v1.txt"
          echo "=================================================="
          
      - name: Upload Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-bollinger-squeeze-backtest-results
          path: h1_squeeze_results_v1.txt
          retention-days: 7
