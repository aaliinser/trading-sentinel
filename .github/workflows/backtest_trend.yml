name: Backtest Strategy 2 (Trend v2)

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_trend.py'
      - '.github/workflows/backtest_trend.yml'

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run Backtest
        run: python backtest_trend.py

      - name: Upload Backtest Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-trend-v2-results
          path: |
            backtest_trend_result.json
            backtest_trend_trades.csv
