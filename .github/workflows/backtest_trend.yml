name: Backtest - Trend Following Strategy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy tzdata

      - name: Run backtest
        env:
          PYTHONUNBUFFERED: "1"
          TZ: "Asia/Hebron"
        run: |
          python backtest_trend.py

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-trend-results
          path: |
            backtest_trend_result.json
            backtest_trend_trades.csv
          if-no-files-found: warn

      - name: Commit results to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f "backtest_trend_result.json" ]; then git add backtest_trend_result.json; fi
          if [ -f "backtest_trend_trades.csv" ]; then git add backtest_trend_trades.csv; fi

          if git diff --cached --quiet; then
            echo ">>> No results to commit."
          else
            git commit -m "backtest: trend following results [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
              sleep 3
            done
            echo ">>> Results pushed."
          fi
