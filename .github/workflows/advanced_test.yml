name: Advanced Quant Backtest

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Deps
      run: pip install numpy pandas yfinance scipy
    - name: Run
      run: python backtest_advanced_quant.py
