name: Final Validation Check

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Deps
      run: pip install numpy pandas yfinance scipy
    - name: Run Validation
      run: python final_validation.py
