name: Random Search 1000 Strategies M15

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Increased for large loop
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Deps
      run: pip install numpy pandas yfinance scipy
    - name: Run Random Search
      run: python random_search_1000_m15.py
