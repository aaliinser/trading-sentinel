name: Sniper Strategy Backtest (1 Year Full Test)

on:
  workflow_dispatch: # نشغله يدوياً فقط عند الرغبة في الاختبار الشامل

jobs:
  backtest-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # تثبيت المكتبات اللازمة للتحليل التاريخي الضخم
        pip install pandas numpy yfinance matplotlib
        
    - name: Run 1-Year Historical Backtest
      run: |
        python backtest_sniper_77.py
