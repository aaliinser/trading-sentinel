name: Sniper Momentum Trap Bot

on:
  schedule:
    # يعمل كل 5 دقائق بتوقيت UTC
    - cron: '*/5 * * * *'
  workflow_dispatch: # يسمح بالتشغيل اليدوي للاختبار

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.14'  # <--- إصدار دقيق ومتوافق تماماً

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # تثبيت المكتبات الأساسية والتبعيات أولاً لضمان الاستقرار
        pip install ccxt pandas numpy python-telegram-bot
        # تثبيت pandas-ta مع إعادة التثبيت القسري لضمان التوافق
        pip install pandas-ta --force-reinstall
        
    - name: Run Sniper Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python backtest_sniper_77.py
