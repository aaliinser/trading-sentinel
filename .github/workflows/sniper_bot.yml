name: Sniper Momentum Trap Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # للتشغيل اليدوي والرؤية الفورية

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # نثبت فقط المكتبات الأساسية للتحليل الرياضي وجلب البيانات
        pip install ccxt pandas numpy
        
    - name: Run Analysis Engine
      run: |
        python backtest_sniper_77.py
