name: Sniper Momentum Trap Bot

on:
  schedule:
    # يعمل كل 5 دقائق بتوقيت UTC
    - cron: '*/5 * * * *'
  workflow_dispatch: # للتشغيل اليدوي

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # الحل الجذري: التثبيت من المصدر المباشر وتجاوز الكاش
        pip install ccxt pandas python-telegram-bot
        pip install git+https://github.com/twopirllc/pandas-ta.git --force-reinstall --no-cache-dir

    - name: Run Sniper Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python backtest_sniper_77.py
