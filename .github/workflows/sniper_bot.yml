name: Sniper Momentum Trap Bot (Forex Edition)

on:
  schedule:
    - cron: '*/5 * * * *' # يعمل كل 5 دقائق
  workflow_dispatch: # للتشغيل اليدوي

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # تثبيت المكتبات الأساسية + مكتبة oandapyV20 للاتصال بالفوركس
        pip install pandas numpy requests oandapyV20
        
    - name: Run Forex Analysis Engine
      env:
        # ضع بيانات حسابك التجريبي هنا إذا أردت، أو اتركها فارغة لاستخدام الوضع العام (Public Demo)
        OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }} 
        ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
      run: |
        python backtest_sniper_77.py
