name: Sniper Momentum Trap Bot (Real Forex via YFinance)

on:
  schedule:
    - cron: '*/5 * * * *' # يعمل كل 5 دقائق
  workflow_dispatch: # للتشغيل اليدوي

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # تثبيت المكتبات الأساسية للتحليل الرياضي + yfinance لجلب بيانات الفوركس
        pip install pandas numpy yfinance
        
    - name: Run Real Forex Analysis Engine
      run: |
        python backtest_sniper_77.py
