name: Sniper Momentum Trap Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-22.04 # استخدام نسخة محددة من أوبونتو لضمان الاستقرار

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # <--- الحل هنا: تثبيت بايثون 3.11 بدقة

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # تثبيت المكتبات الأساسية
        pip install ccxt pandas python-telegram-bot
        # تثبيت pandas-ta النسخة المتوافقة مع 3.11
        pip install pandas-ta==0.3.14b0

    - name: Run Sniper Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python backtest_sniper_77.py
