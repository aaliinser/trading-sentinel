name: H1 Stochastic Live Bot (Persistent State)

on:
  schedule:
    - cron: '*/5 * * * *' 
  workflow_dispatch:

jobs:
  run-live-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # 1. تحميل الكود
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تجهيز البيئة
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. تثبيت المكتبات
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests numpy pandas yfinance

      # ★★ الإضافة الجوهرية: تنزيل الحالة السابقة إن وجدت ★★
      - name: Restore previous state artifact
        id: restore-state
        uses: actions/cache@v3
        with:
          path: ./state_h1.json
          key: h1-stoch-state-${{ github.run_id }}
          restore-keys: |
            h1-stoch-state-

      # 4. تشغيل البوت
      - name: Run H1 Stoch Live Bot Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python h1_stoch_bot.py

      # ★★ الإضافة الثانية: حفظ الحالة الجديدة كـ Artifact ★★
      - name: Upload current state artifact
        if: always() # حتى لو فشل السكربت نحاول حفظ ما لدينا
        uses: actions/upload-artifact@v3
        with:
          name: h1-stoch-state-current
          path: ./state_h1.json
          retention-days: 1 # نحتفظ به ليوم واحد فقط لتوفير المساحة
