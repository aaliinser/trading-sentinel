name: H1 Stochastic Bot (State Persistent v4.5 - Auto-Fix Name)

on:
  workflow_dispatch: # للتشغيل اليدوي
  schedule:
    # نبضة كل 30 دقيقة عند :03 و :33
    - cron: '3,33 * * * *' 

permissions:
  contents: write   # ضروري لحفظ الحالة في Git

concurrency:
  group: h1-bot-final
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      # 1. سحب الكود
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. تثبيت المكتبات
      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests

      # ★★ الخطوة 4: تحديد اسم الملف الذكي ★★
      # بدلاً من افتراض اسم واحد، نبحث عن الملفات الممكنة ونشغل الأول الموجود
      - name: Detect and Run Bot Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          echo ">>> Searching for bot script..."
          
          # قائمة الأسماء المحتملة (ضع اسمك الحقيقي أولها)
          CANDIDATES=("h1_bot.py" "m5_bot.py" "main.py" "bot_h1.py")
          
          SCRIPT_FOUND=""
          for file in "${CANDIDATES[@]}"; do
            if [ -f "$file" ]; then
              SCRIPT_FOUND="$file"
              break
            fi
          done
          
          if [ -z "$SCRIPT_FOUND" ]; then
            echo "::error:: Could not find any bot script! Checked: ${CANDIDATES[*]}"
            exit 1
          fi
          
          echo ">>> Found script: $SCRIPT_FOUND"
          echo ">>> Running it now..."
          python "$SCRIPT_FOUND"

      # ★★ الخطوة 5: حفظ الحالة بأمان تام ★★
      - name: Persist bot state safely
        if: always() # ينفذ دائماً سواء نجح البوت أم فشل
        run: |
          git config user.name "h1-bot-auto-save"
          git config user.email "bot@example.com"
          
          # نتحقق هل تم إنشاء ملف الحالة؟
          STATE_FILE="state_h1_ultimate_v45.json"
          
          if [ -f "$STATE_FILE" ]; then
            echo ">>> State file found. Committing changes..."
            git add "$STATE_FILE"
            
            # نتحقق هل هناك تغييرات فعلية؟
            if ! git diff --cached --quiet; then
              git commit -m "chore: auto-persist H1 bot state $(date +%Y-%m-%d_%H:%M)"
              git push origin HEAD:${{ github.ref_name }} || echo "Push failed or no remote access."
            else
              echo ">>> No new data to save."
            fi
          else
            echo ">>> Warning: State file '$STATE_FILE' was NOT created by the bot."
            echo ">>> This usually means the bot crashed before saving or didn't run correctly."
          fi
