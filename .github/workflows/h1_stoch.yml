name: H1 Stochastic Bot (State Persistent v4.5 - Final Fix)

on:
  workflow_dispatch: # للتشغيل اليدوي الفوري
  schedule:
    # نبضة كل 30 دقيقة عند :03 و :33 (مثالي لفريم الساعة + هامش تحديث البيانات)
    - cron: '3,33 * * * *' 

permissions:
  contents: write   # ★ ضروري جداً: السماح للبوت بحفظ الحالة في المستودع ★

concurrency:
  group: h1-bot     # منع تشغيل دورتين في نفس الوقت لتجنب تضارب الملفات
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      # 1. سحب الكود الحالي
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. تثبيت المكتبات
      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests

      # 4. تشغيل البوت (الكود v4.5 المصحح)
      - name: Run H1 Bot Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python h1_bot.py  # ← تأكد أن اسم الملف هنا هو h1_bot.py

      # ★★ الخطوة الحاسمة والمصححة: حفظ الحالة بأمان ★★
      # هذه الخطوة تتحقق من وجود الملف أولاً قبل محاولة إضافته لـ Git
      - name: Persist bot state safely
        if: always() # نفذ هذه الخطوة دائماً سواء نجح البوت أم فشل
        run: |
          git config user.name "h1-bot-auto-save"
          git config user.email "bot@example.com"
          
          # نتحقق هل الملف موجود فعلاً؟
          if [ -f "state_h1_ultimate_v45.json" ]; then
            echo ">>> File found. Attempting to commit..."
            git add state_h1_ultimate_v45.json
            
            # نتحقق هل هناك تغييرات حقيقية تستحق الحفظ؟
            if ! git diff --cached --quiet; then
              git commit -m "chore: auto-persist H1 bot state $(date +%Y-%m-%d_%H:%M)"
              git push origin HEAD:${{ github.ref_name }} || echo "Push failed or no changes."
            else
              echo ">>> No new data to save."
            fi
          else
            echo ">>> State file not created by bot (likely due to error in script)."
            echo ">>> Skipping save step gracefully."
          fi
