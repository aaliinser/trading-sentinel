name: H1 Stochastic Bot (State Persistent v5.0 - Smart Sniper)

on:
  # التشغيل عبر النبضات الخارجية من cron-job.org
  repository_dispatch:
    types: [trigger-h1-bot]
  
  # خيار احتياطي للتشغيل اليدوي إذا لزم الأمر
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # ★★ هام جداً: منح صلاحية الكتابة لحفظ ملف الحالة ★★
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # يستخدم توكن الوصول الافتراضي للمستودع

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests tzdata

      - name: Run H1 Bot Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          echo "Starting H1 Smart Sniper Execution..."
          python h1_stoch_bot.py
          echo "Execution Finished."

      # ★★ الخطوة الحاسمة: حفظ حالة البوت ومنع التكرار ★★
      - name: Persist bot state (commit & push)
        if: always() # تنفذ هذه الخطوة حتى لو فشل السكربت السابق قليلاََ
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          
          # إضافة ملف الحالة الجديد فقط
          git add state_h1_smart_sniper_v5.json || true
          
          # محاولة الالتزام (Commit). إذا لم يتغير شيء، لن يفعل شيئاً.
          git commit -m "chore: auto-persist H1 bot state [skip ci]" || echo "No changes to commit"
          
          # الدفع للمستودع مع إعادة المحاولة عند التعارض
          git push || {
            echo "Push failed, trying pull-rebase-push..."
            git pull --rebase origin main
            git push
          }
