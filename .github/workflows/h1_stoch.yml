name: H1 Stochastic Bot (State Persistent v4.6 - Guaranteed Reports)

on:
  workflow_dispatch: # للتشغيل اليدوي الفوري عند الحاجة
  schedule:
    # ★ نبضة كل 30 دقيقة عند :05 و :35 ★
    # هذا التوقيت مثالي لفريم الساعة، فهو يعطي منصة yfinance 5 دقائق 
    # لإغلاق الشمعة وتحديث البيانات، مما يتوافق تماماً مع منطق الـ 62 دقيقة في الكود.
    - cron: '5,35 * * * *'

permissions:
  contents: write   # ★ ضروري جداً: السماح للبوت بحفظ الحالة (Commit & Push) في المستودع ★

concurrency:
  group: h1-bot-v46 # يمنع تشغيل دورتين في نفس الوقت لتجنب تضارب ملفات الحالة
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      # 1. سحب الكود الحالي من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت بيئة بايثون (نسخة 3.10+ لدعم ZoneInfo بشكل أصلي)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. تثبيت المكتبات المطلوبة
      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests tzdata
          # ★ ملاحظة: إضافة tzdata ضرورية جداً لضمان عمل ZoneInfo("Asia/Gaza") على خوادم لينكس

      # 4. تشغيل سكربت البوت
      - name: Run H1 Bot Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        # ⚠️ تأكد أن اسم الملف هنا يطابق تماماً اسم الملف في مستودع GitHub الخاص بك
        run: python h1_stoch_bot.py

      # ★★ 5. الخطوة الحاسمة: حفظ حالة البوت كـ Commit في المستودع بأمان ★★
      - name: Persist bot state (commit & push)
        if: always() # نفذ هذه الخطوة دائماً، سواء نجح البوت أم فشل، للحفاظ على آخر حالة
        run: |
          git config user.name "h1-bot-auto-save"
          git config user.email "h1-bot@users.noreply.github.com"
          
          STATE_FILE="state_h1_ultimate_v45.json"
          
          # نتحقق هل الملف موجود فعلاً قبل محاولة إضافته لـ Git
          if [ -f "$STATE_FILE" ]; then
            echo ">>> State file found. Attempting to commit..."
            git add "$STATE_FILE"
            
            # نتحقق هل هناك تغييرات حقيقية في الملف تستحق الحفظ؟
            if ! git diff --cached --quiet; then
              git commit -m "chore: auto-persist H1 bot state $(date +%Y-%m-%d_%H:%M)"
              git push origin HEAD:${{ github.ref_name }} || echo "Push failed or no remote access."
              echo ">>> State pushed to repository successfully."
            else
              echo ">>> No new data to save."
            fi
          else
            echo ">>> Warning: State file '$STATE_FILE' was NOT created by the bot."
            echo ">>> Skipping save step gracefully to prevent workflow crash."
          fi
