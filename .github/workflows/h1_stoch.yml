name: H1 Stochastic Ultimate Bot (v3.1)

on:
  schedule:
    # يعمل كل ساعة عند الدقيقة 0 (متزامن مع إغلاق شموع H1)
    - cron: '0 * * * *'
  workflow_dispatch: # يسمح بالتشغيل اليدوي للاختبار

jobs:
  run-h1-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # 1. تحميل الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. تثبيت المكتبات المطلوبة
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests numpy pandas yfinance

      # 4. استعادة حالة البوت السابقة (صفقات مفتوحة + سجلات)
      # ★★ ملاحظة هامة: يجب أن يطابق المسار هنا STATE_FILE في الكود ★★
      - name: Restore previous state artifact
        id: restore-state
        uses: actions/cache@v4
        with:
          path: ./state_h1_ultimate.json  # <-- يطابق STATE_FILE في كود البايثون
          key: h1-ultimate-state-${{ github.run_id }}
          restore-keys: |
            h1-ultimate-state-

      # 5. تشغيل سكربت البوت
      # ★★ تم تعديل السطر التالي ليطابق اسم ملفك h1_stoch_bot.py ★★
      - name: Run H1 Ultimate Bot Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python h1_stoch_bot.py 

      # 6. حفظ الحالة الجديدة بعد انتهاء الدورة
      # if: always() يضمن الحفظ حتى لو فشل السكربت لسبب طفيف، لحماية البيانات
      - name: Upload current state artifact
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: h1-ultimate-state-current
          path: ./state_h1_ultimate.json   # <-- نفس المسار أعلاه
          retention-days: 1
