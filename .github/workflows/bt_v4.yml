name: BT_v4
on:
  workflow_dispatch:
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests numpy pandas yfinance python-dotenv pandas-ta || pip install requests numpy pandas yfinance python-dotenv
      - run: python backtest_fx.py
        env:
          VERSION: "4"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
