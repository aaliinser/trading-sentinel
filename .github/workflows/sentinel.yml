name: Scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ghaith-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pandas yfinance

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: ghaith_state.json
          key: ghaith-state-${{ github.run_id }}
          restore-keys: |
            ghaith-state-

      - name: Run strategy
        run: python sentinel.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          MIN_SIGNAL_SCORE: "2"
          MAX_DEV: "0.0010"
          MAX_AHEAD: "0.0004"

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ghaith_state.json
          key: ghaith-state-${{ github.run_id }}
