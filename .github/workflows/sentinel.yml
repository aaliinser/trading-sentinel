name: Scan15

on:
  workflow_dispatch:

concurrency:
  group: ghaith-scan-15m
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-v1
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pandas yfinance ntplib python-dotenv
          pip install pandas-ta || echo "pandas-ta غير متوفر - سيستخدم البوت المؤشرات البديلة المدمجة"

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: ghaith_state.json
          key: ghaith15-${{ github.run_id }}
          restore-keys: |
            ghaith15-

      - name: Run strategy
        run: python sentinel.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          SCAN_TIMEFRAME: "15m"
          SNIPER_TIMEFRAME: "5m"
          TREND_TIMEFRAME: "1h"
          EXPIRY_MINUTES: "15"
          STATE_FILE: "ghaith_state.json"
          LOG_FILE: "ghaith_bot.log"
          MODE_LABEL: " ⏱️ 15m"
          MIN_SIGNAL_SCORE: "3"
          MAX_DEV: "0.0015"
          RUN_BUDGET_SECONDS: "150"
          SCAN_INTERVAL_SECONDS: "40"
          SYMBOLS: "USDJPY=X,AUDJPY=X,EURJPY=X,EURUSD=X,GBPUSD=X,EURGBP=X,CADJPY=X,EURCAD=X,GBPCAD=X,AUDCHF=X,AUDUSD=X,USDCHF=X,CHFJPY=X,AUDCAD=X,USDCAD=X,EURAUD=X,EURCHF=X,GBPJPY=X,GBPCHF=X,GBPAUD=X"
          RISK_GATE_ENABLED: "true"
          MAX_TRADES_PER_DAY: "3"
          MAX_LOSSES_PER_DAY: "3"
          TRADE_HOUR_START: "0"
          TRADE_HOUR_END: "22"
          RSI_CALL_MAX: "55"
          RSI_PUT_MIN: "45"
          IMPULSE_GUARD_ATR: "1.5"

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ghaith_state.json
          key: ghaith15-${{ github.run_id }}
