      - name: Run strategy
        run: python sentinel.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          MAX_TRADES_PER_DAY: "99"
          MAX_LOSSES_PER_DAY: "99"
          COOLDOWN_MINUTES: "0"
          MIN_SIGNAL_SCORE: "3"
          MAX_DEV: "0.0006"
