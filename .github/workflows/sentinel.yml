name: Scan

on:
  # كل 5 دقائق بتوقيت UTC — إذا كانت جدولتك القديمة مختلفة، غيّر الـ cron فقط
  schedule:
    - cron: "*/5 * * * *"
  # زر تشغيل يدوي من تبويب Actions
  workflow_dispatch:

# منع تشغيل نسختين بنفس الوقت (يحميك من إشارات مكررة)
concurrency:
  group: ghaith-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ✅ هنا الحل: تثبيت كل المكتبات التي يحتاجها الكود الجديد
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pandas yfinance

      # ✅ استرجاع حالة البوت والمراقبات من التشغيله السابقة
      # (أول مرة ستظهر رسالة "Cache not found" — هذا طبيعي جداً)
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: ghaith_state.json
          key: ghaith-state-${{ github.run_id }}
          restore-keys: |
            ghaith-state-

      # ✅ تشغيل البوت بنفس أسماء الأسرار القديمة عندك
      - name: Run strategy
        run: python sentinel.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}

      # ✅ حفظ الحالة والمراقبات للتشغيلة الجاية (حتى لو صار خطأ)
      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ghaith_state.json
          key: ghaith-state-${{ github.run_id }}
